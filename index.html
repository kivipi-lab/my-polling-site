<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PollHub - Create and Vote on Polls</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);
      color: white; padding: 30px; text-align: center;
    }
    .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .header p { font-size: 1.1rem; opacity: 0.9; }
    .nav-tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid #e9ecef; }
    .nav-tab {
      flex: 1; padding: 20px; text-align: center; border: none;
      cursor: pointer; font-size: 1.1rem; font-weight: 600;
      color: #6c757d; background: none; transition: all .3s;
      position: relative;
    }
    .nav-tab.active { color: #4facfe; background: white; }
    .nav-tab.active::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px; background: linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);
    }
    .tab-content { display: none; padding: 30px; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 25px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #495057; }
    input[type="text"], textarea {
      width: 100%; padding: 15px; border: 2px solid #e9ecef;
      border-radius: 10px; font-size: 1rem;
    }
    .option-input { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .option-input input { flex: 1; }
    .btn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg,#4facfe 0%,#00f2fe 100%); color: white; }
    .btn-danger { background: #dc3545; color: white; padding: 8px 15px; }
    .btn-add { background: #28a745; color: white; padding: 8px 15px; }
    .btn-secondary { background: #6c757d; color: white; }
    .poll-card { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; border: 1px solid #e9ecef; }
    .poll-title { font-size: 1.5rem; font-weight: 700; color: #2c3e50; margin-bottom: 10px; }
    .poll-description { color: #6c757d; margin-bottom: 20px; }
    .voting-option { display: flex; justify-content: space-between; padding: 15px; background: #f8f9fa; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
    .voting-option.selected { border: 2px solid #28a745; background: rgba(40,167,69,0.1); }
    .vote-count { background: #4facfe; color: white; padding: 5px 12px; border-radius: 20px; font-weight: 600; }
    .poll-results { margin-top: 20px; padding-top: 20px; border-top: 2px solid #e9ecef; }
    .admin-stats { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; padding: 20px; border-radius: 15px; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 700; }
    
  </style>
</head>
<body>
  
  <div class="container">
    <div class="header">
      <h1>🗳️ PollHub</h1>
      <p>Create polls, collect votes, and analyze results</p>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('vote')">Vote on Polls</button>
      <button class="nav-tab" id="create-tab-button" style="display:none;" onclick="switchTab('create')">Create Poll</button>
      <button class="nav-tab" onclick="switchTab('admin')">Admin Panel</button>
    </div>

    <!-- Vote Tab -->
    <div class="tab-content active" id="vote-tab"><div id="polls-container"></div></div>

    <!-- Create Poll Tab -->
    <div class="tab-content" id="create-tab" style="display:none;">
      <h2>Create New Poll</h2>
      <form id="poll-form" onsubmit="return false;">
        <div class="form-group">
          <label for="poll-title">Poll Title *</label>
          <input type="text" id="poll-title" required>
        </div>
        <div class="form-group">
          <label for="poll-description">Description</label>
          <textarea id="poll-description"></textarea>
        </div>
        <div class="form-group">
          <label>Poll Options *</label>
          <div id="options-container">
            <div class="option-input">
              <input type="text" placeholder="Option 1" required>
              <button type="button" class="btn btn-danger" onclick="removeOption(this)">Remove</button>
            </div>
            <div class="option-input">
              <input type="text" placeholder="Option 2" required>
              <button type="button" class="btn btn-danger" onclick="removeOption(this)">Remove</button>
            </div>
          </div>
          <button type="button" class="btn btn-add" onclick="addOption()">Add Option</button>
        </div>
        <button type="button" class="btn btn-primary" onclick="createPoll(event)">Create Poll</button>
      </form>
    </div>

    <!-- Admin Tab -->
    <div class="tab-content" id="admin-tab">
      <div id="admin-login">
        <h2>Admin Access</h2>
        <div class="form-group">
          <label for="admin-password-input">Password</label>
          <input type="password" id="admin-password-input">
        </div>
        <button onclick="adminLogin()" class="btn btn-primary">Login</button>
      </div>
      <div id="admin-panel" style="display:none;">
        <h2>Admin Dashboard</h2>
        <div class="admin-stats" id="admin-stats"></div>
        <div id="admin-polls"></div>
        <div style="margin-top:30px;">
          <button onclick="exportData()" class="btn btn-primary">Export All Data (JSON)</button>
          <button onclick="clearAllData()" class="btn btn-danger">Clear All Data</button>
          <button onclick="adminLogout()" class="btn btn-secondary">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let polls = JSON.parse(localStorage.getItem('pollhub_polls') || '[]');
    let votes = JSON.parse(localStorage.getItem('pollhub_votes') || '[]');
    let selectedOptions = {};
    let isAdmin = false;

    function init(){ displayPolls(); updateAdminStats(); }
    function switchTab(tab){ switchToTab(tab); }
    function switchToTab(tabName){
      document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
      const btn=document.querySelector(`.nav-tab[onclick*="${tabName}"]`); if(btn) btn.classList.add('active');
      const target=document.getElementById(tabName+'-tab'); if(target) target.classList.add('active');
    }

    function addOption(){
      const container=document.getElementById('options-container');
      const optionCount=container.children.length+1;
      const div=document.createElement('div');
      div.className='option-input';
      div.innerHTML=`<input type="text" placeholder="Option ${optionCount}" required>
      <button type="button" class="btn btn-danger" onclick="removeOption(this)">Remove</button>`;
      container.appendChild(div);
    }

    function removeOption(btn){
      const container=document.getElementById('options-container');
      if(container.children.length>2){ btn.parentElement.remove(); }
      else{ alert('A poll must have at least 2 options.'); }
    }

    function createPoll(e){
      if(!isAdmin){ alert("Only administrators can create polls."); return false; }
      if(e) e.preventDefault();
      const title=document.getElementById('poll-title').value.trim();
      const desc=document.getElementById('poll-description').value.trim();
      const optionInputs=document.querySelectorAll('#options-container input');
      const options=Array.from(optionInputs).map(i=>i.value.trim()).filter(v=>v);
      if(!title){ alert('Please enter a poll title.'); return false; }
      if(options.length<2){ alert('At least 2 options required.'); return false; }
      const poll={ id:Date.now().toString(), title, description:desc,
        options:options.map((o,i)=>({id:i,text:o})), createdAt:new Date().toISOString() };
      polls.push(poll); savePollsToStorage();
      document.getElementById('poll-title').value=''; document.getElementById('poll-description').value='';
      resetOptionsContainer(); displayPolls(); updateAdminStats();
      alert('Poll created successfully!'); switchToTab('vote'); return false;
    }

    function resetOptionsContainer(){
      document.getElementById('options-container').innerHTML=`
        <div class="option-input"><input type="text" placeholder="Option 1" required>
        <button type="button" class="btn btn-danger" onclick="removeOption(this)">Remove</button></div>
        <div class="option-input"><input type="text" placeholder="Option 2" required>
        <button type="button" class="btn btn-danger" onclick="removeOption(this)">Remove</button></div>`;
    }

    function displayPolls(){
      const c=document.getElementById('polls-container');
      if(polls.length===0){ c.innerHTML=`<div class="poll-card"><h3>No polls available</h3></div>`; return; }
      c.innerHTML=polls.map(p=>{
        const pv=votes.filter(v=>v.pollId===p.id);
        const vc=p.options.map(o=>({...o,count:pv.filter(v=>v.optionId===o.id).length}));
        return `<div class="poll-card">
          <h3 class="poll-title">${p.title}</h3>
          ${p.description?`<p class="poll-description">${p.description}</p>`:''}
          <div class="voter-name-input"><label>Your name (optional)</label>
          <input type="text" id="voter-name-${p.id}"></div>
          <div id="options-${p.id}">
            ${vc.map(o=>`<div class="voting-option" onclick="selectOption('${p.id}',${o.id})"><span>${o.text}</span><span class="vote-count">${o.count}</span></div>`).join('')}
          </div>
          <button onclick="submitVote('${p.id}')" class="btn btn-primary">Submit Vote</button>
        </div>`; }).join('');
    }

    function selectOption(pid,oid){
      selectedOptions[pid]=oid;
      const c=document.getElementById(`options-${pid}`);
      c.querySelectorAll('.voting-option').forEach(o=>o.classList.remove('selected'));
      event.target.closest('.voting-option').classList.add('selected');
    }

    function submitVote(pid){
      const sel=selectedOptions[pid]; if(sel===undefined){ alert('Select an option.'); return; }
      const voter=document.getElementById(`voter-name-${pid}`).value.trim()||'Anonymous';
      votes.push({id:Date.now().toString(),pollId:pid,optionId:sel,voterName:voter,timestamp:new Date().toISOString()});
      saveVotesToStorage(); delete selectedOptions[pid];
      displayPolls(); updateAdminStats(); alert('Vote submitted!');
    }

    function savePollsToStorage(){ localStorage.setItem('pollhub_polls',JSON.stringify(polls)); }
    function saveVotesToStorage(){ localStorage.setItem('pollhub_votes',JSON.stringify(votes)); }

    function adminLogin(){
      const pw=document.getElementById('admin-password-input').value;
      if(pw==='admin123'){ 
        isAdmin=true;
        document.getElementById('admin-login').style.display='none';
        document.getElementById('admin-panel').style.display='block';
        document.getElementById('create-tab-button').style.display='block';
        document.getElementById('create-tab').style.display='block'; // ✅ show content
        updateAdminView();
      } else alert('Incorrect password.');
    }

    function adminLogout(){
      isAdmin=false;
      document.getElementById('admin-login').style.display='block';
      document.getElementById('admin-panel').style.display='none';
      document.getElementById('create-tab-button').style.display='none';
      document.getElementById('create-tab').style.display='none'; // ✅ hide content
      document.getElementById('create-tab').classList.remove('active');
      switchToTab('vote');
    }

    function updateAdminStats(){
      document.getElementById('admin-stats').innerHTML=
        `<div class="stat-card"><div class="stat-value">${polls.length}</div><div>Total Polls</div></div>
         <div class="stat-card"><div class="stat-value">${votes.length}</div><div>Total Votes</div></div>
         <div class="stat-card"><div class="stat-value">${new Set(votes.map(v=>v.voterName)).size}</div><div>Unique Voters</div></div>`;
    }

    function updateAdminView(){
      updateAdminStats();
      const c=document.getElementById('admin-polls');
      c.innerHTML=polls.map(p=>{
        const pv=votes.filter(v=>v.pollId===p.id);
        const vc=p.options.map(o=>({...o,count:pv.filter(v=>v.optionId===o.id).length}));
        return `<div class="poll-card"><h4>${p.title}</h4>
          <p>Created: ${new Date(p.createdAt).toLocaleString()}</p>
          <p>Total Votes: ${pv.length}</p>
          ${vc.map(o=>`
  <div style="margin:10px 0; padding:10px; background:#f8f9fa; border-radius:8px;">
    <strong>${o.text}:</strong> ${o.count} votes
    ${pv.filter(v=>v.optionId===o.id).length > 0
      ? `<br><small>Voters: ${pv.filter(v=>v.optionId===o.id).map(v=>v.voterName).join(', ')}</small>`
      : ''}
  </div>
`).join('')}
          <button onclick="deletePoll('${p.id}')" class="btn btn-danger">Delete Poll</button>
        </div>`; }).join('');
    }

    function deletePoll(id){
      if(confirm('Delete poll?')){ polls=polls.filter(p=>p.id!==id); votes=votes.filter(v=>v.pollId!==id);
        savePollsToStorage(); saveVotesToStorage(); displayPolls(); updateAdminView(); }
    }

    function exportData(){ const data={polls,votes}; const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='pollhub-data.json'; a.click(); URL.revokeObjectURL(url); }

    function clearAllData(){ if(confirm('Clear ALL data?')){ polls=[]; votes=[]; localStorage.clear(); displayPolls(); updateAdminView(); } }

    window.onload=init;
  </script>
</body>
</html>
